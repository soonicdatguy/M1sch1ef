
<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 64 64"
     width="64" height="64"
     preserveAspectRatio="xMidYMid meet"
     role="img" aria-label="M1sch1ef logo">
  <title>M1sch1ef</title>
  <defs>
    <linearGradient id="m1-g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8ff2e"/>
      <stop offset="100%" stop-color="#7cd900"/>
    </linearGradient>
    <linearGradient id="m1-g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2e92"/>
      <stop offset="100%" stop-color="#a4006b"/>
    </linearGradient>
    <filter id="m1-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- dark rounded square base -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14"
        fill="#0d0d14" stroke="#2a2a40" stroke-width="1.2"/>

  <!-- inner soft glow ring -->
  <rect x="6" y="6" width="52" height="52" rx="11" ry="11"
        fill="none" stroke="url(#m1-g1)" stroke-opacity="0.18" stroke-width="1"/>

  <!-- mischief grin -->
  <g filter="url(#m1-glow)">
    <!-- horns -->
    <path d="M18 18 L22 10 L26 18 Z" fill="url(#m1-g2)"/>
    <path d="M46 18 L42 10 L38 18 Z" fill="url(#m1-g2)"/>

    <!-- eyes -->
    <circle cx="24" cy="30" r="3.2" fill="url(#m1-g1)"/>
    <circle cx="40" cy="30" r="3.2" fill="url(#m1-g1)"/>

    <!-- smirk -->
    <path d="M20 42 Q32 54 44 42" fill="none"
          stroke="url(#m1-g1)" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- tooth -->
    <path d="M30 47 L32 51 L34 47 Z"
          fill="#0d0d14" stroke="url(#m1-g1)" stroke-width="1"/>
  </g>

  <!-- corner glitch ticks -->
  <rect x="6" y="6" width="6" height="1.2" fill="#b8ff2e"/>
  <rect x="6" y="6" width="1.2" height="6" fill="#b8ff2e"/>
  <rect x="52" y="56.8" width="6" height="1.2" fill="#ff2e92"/>
  <rect x="56.8" y="52" width="1.2" height="6" fill="#ff2e92"/>
</svg>
